services:
  mongo:
    image: mongo:7
    network_mode: host
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    network_mode: host
    environment:
      - MONGO_URI=mongodb://localhost:27017/
    depends_on:
      - mongo

  device:
    build: ./device
    network_mode: host
    environment:
      - API_URL=http://localhost:5000/humidity
      - DEVICE_ID=sensor-01
    depends_on:
      - api

volumes:
  mongo_data: